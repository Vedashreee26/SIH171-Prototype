<!DOCTYPE html>
<html>
<head>
    <title>VisionGuard Test</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
            color: white;
        }

        .container {
            width: 380px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;

            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);

            text-align: center;
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #6366f1;
            border-radius: 50%;
            font-size: 30px;

            box-shadow: 0 0 25px rgba(99, 102, 241, 0.5);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            color: #e2e8f0;
        }

        input {
            width: 100%;
            padding: 13px 15px;

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;

            background: rgba(255, 255, 255, 0.08);
            color: white;
            outline: none;

            font-size: 14px;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;

            font-size: 15px;
            font-weight: bold;
            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .status {
            margin-top: 22px;
            font-size: 12px;
            color: #94a3b8;
        }

        .status span {
            color: #4ade80;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🛡️</div>

        <h1>VisionGuard</h1>

        <p class="subtitle">
            Secure authentication test interface
        </p>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Enter your password">
        </div>

        <button id="submit-btn" onclick="goToDashboard()">
            Submit
        </button>

        <div class="status">
            System Status: <span>● Online</span>
        </div>

    </div>

    <script>
        function goToDashboard() {
            window.location.href = "dashboard1.html";
        }
    </script>

</body>
</html>
