<!DOCTYPE html>
<html>
<head>
    <title>VisionGuard Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
            color: white;
        }

        .dashboard {
            width: 600px;
            padding: 45px;
            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;

            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .success {
            padding: 15px;
            border-radius: 10px;

            background: rgba(74, 222, 128, 0.12);
            border: 1px solid rgba(74, 222, 128, 0.3);

            color: #86efac;
            margin-bottom: 25px;
        }

        .back {
            display: inline-block;
            padding: 12px 25px;

            border-radius: 10px;
            text-decoration: none;

            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-weight: bold;
        }

        .back:hover {
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <div class="icon">🛡️</div>

        <h1>Welcome to VisionGuard</h1>

        <p>
            You have successfully reached the protected page.
        </p>

        <div class="success">
            ✓ Authentication successful
        </div>

        <a href="test.html" class="back">
            ← Back to Login
        </a>

    </div>

</body>
</html>
